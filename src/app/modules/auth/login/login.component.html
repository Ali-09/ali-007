<div class="min-h-screen flex items-center justify-center">
  <div class="relative w-full max-w-md">
    <div
      class="absolute inset-0 bg-gray-500/10 backdrop-blur-md rounded-2xl p-8 border border-green-600 shadow-2xl shadow-black/40"
    >
  </div>
  <div class="relative p-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-white mb-2">Administración de Pagos</h2>
      <p class="text-green-400">Accede a tu panel de pagos</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-white mb-1"
            >Correo electrónico</label
          >
          <input
            id="email"
            name="email"
            type="email"
            formControlName="email"
            required
            class="w-full px-4 py-3 bg-black/70 border border-green-700/50 rounded-lg text-white placeholder-green-300 focus:outline-none focus:ring-2 focus:ring-green-500/50 focus:border-green-500 transition duration-200"
            placeholder="Ingresa tu correo electrónico"
          />
          <div
            *ngIf="
              loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']
            "
            class="mt-1 text-red-400 text-sm"
          >
            El correo electrónico es requerido
          </div>
          <div
            *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']"
            class="mt-1 text-red-400 text-sm"
          >
            Por favor ingresa un correo electrónico válido
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-white mb-1"
            >Contraseña</label
          >
          <input
            id="password"
            name="password"
            type="password"
            formControlName="password"
            required
            class="w-full px-4 py-3 bg-black/70 border border-green-700/50 rounded-lg text-white placeholder-green-300 focus:outline-none focus:ring-2 focus:ring-green-500/50 focus:border-green-500 transition duration-200"
            placeholder="Ingresa tu contraseña"
          />
          <div
            *ngIf="
              loginForm.get('password')?.touched &&
              loginForm.get('password')?.errors?.['required']
            "
            class="mt-1 text-red-400 text-sm"
          >
            La contraseña es requerida
          </div>
          <div
            *ngIf="
              loginForm.get('password')?.touched &&
              loginForm.get('password')?.errors?.['minlength']
            "
            class="mt-1 text-red-400 text-sm"
          >
            La contraseña debe tener al menos 8 caracteres
          </div>
        </div>
      </div>

      <div class="flex justify-end">
        <a
          href="#"
          class="text-sm font-medium text-green-400 hover:text-green-300 transition duration-200"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <div *ngIf="errorMessage" class="text-red-400 text-sm text-center">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-medium text-white bg-green-700 hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:bg-green-700/50 disabled:cursor-not-allowed transition-all duration-200"
      >
        INICIAR SESIÓN
      </button>

      <div class="text-center">
        <p class="text-sm text-green-400/80">
          ¿No tienes una cuenta?
          <a
            routerLink="/register"
            class="text-green-400 hover:text-green-300 transition duration-200"
          >
            Regístrate
          </a>
        </p>
      </div>
    </form>
  </div>
    
  </div>
</div>
