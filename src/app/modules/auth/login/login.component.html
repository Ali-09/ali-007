<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-800 to-blue-800"
>
  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-900 to-slate-900"
  ></div>

  <div
    class="absolute inset-0 bg-gradient-to-br from-emerald-800 to-blue-800 animate-gradient"
  ></div>

  <div class="relative w-full max-w-md">
    <div
      class="absolute inset-0 bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl"
    ></div>

    <div class="relative p-8">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">Administración de Pagos</h2>
        <p class="text-slate-400">Accede a tu panel de pagos</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium text-slate-300 mb-1"
              >Correo electrónico</label
            >
            <input
              id="email"
              name="email"
              type="email"
              formControlName="email"
              required
              class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition duration-200"
              placeholder="Ingresa tu correo electrónico"
            />
            <div
              *ngIf="
                loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']
              "
              class="mt-1 text-red-400 text-sm"
            >
              El correo electrónico es requerido
            </div>
            <div
              *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']"
              class="mt-1 text-red-400 text-sm"
            >
              Por favor ingresa un correo electrónico válido
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-300 mb-1"
              >Contraseña</label
            >
            <input
              id="password"
              name="password"
              type="password"
              formControlName="password"
              required
              class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition duration-200"
              placeholder="Ingresa tu contraseña"
            />
            <div
              *ngIf="
                loginForm.get('password')?.touched &&
                loginForm.get('password')?.errors?.['required']
              "
              class="mt-1 text-red-400 text-sm"
            >
              La contraseña es requerida
            </div>
            <div
              *ngIf="
                loginForm.get('password')?.touched &&
                loginForm.get('password')?.errors?.['minlength']
              "
              class="mt-1 text-red-400 text-sm"
            >
              La contraseña debe tener al menos 6 caracteres
            </div>
          </div>
        </div>

        <div class="flex justify-end">
          <a
            href="#"
            class="text-sm font-medium text-blue-400 hover:text-blue-300 transition duration-200"
          >
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-emerald-500 hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 disabled:bg-emerald-500/50 disabled:cursor-not-allowed transition duration-200"
        >
          Iniciar sesión
        </button>
      </form>
    </div>
  </div>
</div>
