<div class="min-h-screen flex items-center justify-center bg-emerald-900">
  <div class="relative w-full max-w-md">
    <div
      class="absolute inset-0 bg-gradient-to-br from-cyan-900/80 via-cyan-800/75 to-cyan-500/60 backdrop-blur-xl rounded-2xl p-8 border border-cyan-400/70 shadow-2xl shadow-cyan-900/70"
    >
  </div>
  <div class="relative p-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-white mb-2">Administración de Pagos</h2>
      <p class="text-emerald-300">Accede a tu panel de pagos</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="space-y-4">
        <app-input
          formControlName="email"
          label="Correo electrónico"
          type="email"
          placeholder="Ingresa tu correo electrónico"
          prefixIcon="📧"
          variant="secondary"
        ></app-input>

        <app-input
          formControlName="password"
          label="Contraseña"
          type="password"
          placeholder="Ingresa tu contraseña"
          prefixIcon="🔒"
        ></app-input>
      </div>

      <div class="flex justify-end">
        <a
          href="#"
          class="text-sm font-medium text-emerald-400 hover:text-emerald-300 transition duration-200"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <div *ngIf="errorMessage" class="text-red-400 text-sm text-center">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="btn btn-primary w-full"
      >
        INICIAR SESIÓN
      </button>

      <div class="text-center">
        <p class="text-sm text-emerald-100/80">
          ¿No tienes una cuenta?
          <a
            routerLink="/register"
            class="text-emerald-400 hover:text-emerald-300 transition duration-200"
          >
            Regístrate
          </a>
        </p>
      </div>
    </form>
  </div>
    
  </div>
</div>
