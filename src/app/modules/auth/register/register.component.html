<div class="min-h-screen flex items-center justify-center">
  <div class="relative w-full max-w-md">
    <div
      class="absolute inset-0 bg-gray-500/10 backdrop-blur-md rounded-2xl p-8 border border-green-600 shadow-2xl shadow-black/40"
    >
  </div>

    <div class="relative p-8">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">Crear Cuenta</h2>
        <p class="text-green-400">Regístrate para acceder al panel de pagos</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="space-y-4">
          <app-input
            formControlName="name"
            label="Nombre completo"
            placeholder="Ingresa tu nombre completo"
            prefixIcon="👤"
          ></app-input>

          <app-input
            formControlName="email"
            label="Correo electrónico"
            type="email"
            placeholder="Ingresa tu correo electrónico"
            prefixIcon="📧"
            variant="secondary"
          ></app-input>

          <app-input
            formControlName="password"
            label="Contraseña"
            type="password"
            placeholder="Ingresa tu contraseña"
            prefixIcon="🔒"
          ></app-input>

          <app-input
            formControlName="confirmPassword"
            label="Confirmar contraseña"
            type="password"
            placeholder="Confirma tu contraseña"
            prefixIcon="🔒"
          ></app-input>
        </div>

        <div *ngIf="errorMessage" class="text-red-400 text-sm text-center">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          [disabled]="registerForm.invalid"
          class="btn btn-primary w-full"
        >
          REGISTRARSE
        </button>

        <div class="text-center">
          <p class="text-sm text-green-400/80">
            ¿Ya tienes una cuenta?
            <a
              routerLink="/login"
              class="text-green-400 hover:text-green-300 transition duration-200"
            >
              Inicia sesión
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
