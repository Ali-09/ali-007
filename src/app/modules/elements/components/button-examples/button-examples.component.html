<div class="p-6 text-white">
    <h2 class="text-2xl font-bold mb-6">Botones</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Primary Buttons -->
      <div class="space-y-4">
        <h3 class="text-xl font-semibold text-emerald-400">Primary</h3>
        <div class="flex flex-wrap gap-2">
          <button class="btn btn-primary">Primary</button>
          <button class="btn btn-primary" disabled>Disabled</button>
        </div>
      </div>

      <!-- Secondary Buttons -->
      <div class="space-y-4">
        <h3 class="text-xl font-semibold text-blue-400">Secondary</h3>
        <div class="flex flex-wrap gap-2">
          <button class="btn btn-secondary">Secondary</button>
          <button class="btn btn-secondary" disabled>Disabled</button>
        </div>
      </div>

      <!-- Error Buttons -->
      <div class="space-y-4">
        <h3 class="text-xl font-semibold text-red-400">Error</h3>
        <div class="flex flex-wrap gap-2">
          <button class="btn btn-error">Error</button>
          <button class="btn btn-error" disabled>Disabled</button>
        </div>
      </div>

      <!-- Warning Buttons -->
      <div class="space-y-4">
        <h3 class="text-xl font-semibold text-yellow-300">Warning</h3>
        <div class="flex flex-wrap gap-2">
          <button class="btn btn-warning">Warning</button>
          <button class="btn btn-warning" disabled>Disabled</button>
        </div>
      </div>
    </div>

    <!-- Estados -->
    <div class="space-y-4 mt-4">
      <h3 class="text-xl font-semibold text-blue-100">Estados</h3>
      <div class="flex flex-wrap gap-2">
        <button class="btn btn-primary">Normal</button>
        <button class="btn btn-primary" disabled>Disabled</button>
        <button class="btn btn-primary cursor-not-allowed opacity-50">Loading...</button>
      </div>
    </div>

    <!-- Tamaños -->
    <div class="space-y-4 mt-4">
      <h3 class="text-xl font-semibold text-blue-100">Tamaños</h3>
      <div class="flex flex-wrap items-center gap-2">
        <button class="btn btn-primary text-sm px-3 py-1.5">Small</button>
        <button class="btn btn-primary">Normal</button>
        <button class="btn btn-primary text-lg px-6 py-3">Large</button>
      </div>
    </div>
</div>
