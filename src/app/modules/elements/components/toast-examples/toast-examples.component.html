<div class="p-6 text-white">
  <h2 class="text-2xl font-bold mb-6">Toast Examples</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="space-y-4">
      <h3 class="text-lg font-semibold">Basic Toasts</h3>
      <div class="flex flex-wrap gap-2">
        <button
          class="px-4 py-2 bg-teal-500 text-white rounded-lg hover:bg-teal-600 transition-colors"
          (click)="showSuccess()"
        >
          Success Toast
        </button>
        <button
          class="px-4 py-2 bg-rose-500 text-white rounded-lg hover:bg-rose-600 transition-colors"
          (click)="showError()"
        >
          Error Toast
        </button>
        <button
          class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-colors"
          (click)="showWarning()"
        >
          Warning Toast
        </button>
        <button
          class="px-4 py-2 bg-sky-500 text-white rounded-lg hover:bg-sky-600 transition-colors"
          (click)="showInfo()"
        >
          Info Toast
        </button>
      </div>
    </div>

    <!-- Position Examples -->
    <div class="space-y-4">
      <h3 class="text-lg font-semibold">Position Examples</h3>
      <div class="flex flex-wrap gap-2">
        <button
          class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors"
          (click)="showTopLeft()"
        >
          Top Left
        </button>
        <button
          class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors"
          (click)="showTopRight()"
        >
          Top Right
        </button>
        <button
          class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors"
          (click)="showBottomLeft()"
        >
          Bottom Left
        </button>
        <button
          class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors"
          (click)="showBottomRight()"
        >
          Bottom Right
        </button>
      </div>
    </div>

    <div class="space-y-4">
      <h3 class="text-lg font-semibold">Duration Examples</h3>
      <div class="flex flex-wrap gap-2">
        <button
          class="px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition-colors"
          (click)="showShortDuration()"
        >
          Short (2s)
        </button>
        <button
          class="px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition-colors"
          (click)="showLongDuration()"
        >
          Long (5s)
        </button>
        <button
          class="px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition-colors"
          (click)="showPermanent()"
        >
          Permanent
        </button>
      </div>
    </div>

    <!-- Custom Messages -->
    <div class="space-y-4">
      <h3 class="text-lg font-semibold">Custom Messages</h3>
      <div class="flex flex-wrap gap-2">
        <button
          class="px-4 py-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition-colors"
          (click)="showCustomMessage()"
        >
          Custom Message
        </button>
        <button
          class="px-4 py-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition-colors"
          (click)="showLongMessage()"
        >
          Long Message
        </button>
      </div>
    </div>
  </div>
</div>
