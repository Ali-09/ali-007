<div class="space-y-1.5">
  <label *ngIf="label" class="block text-xs font-semibold tracking-wide text-blue-100/80 uppercase">
    {{ label }}
  </label>

  <div
    class="flex items-center rounded-xl bg-black/60 text-white shadow-sm transition duration-150 border"
    [ngClass]="[containerVariantClass, disabled ? 'opacity-60 cursor-not-allowed' : 'hover:border-emerald-300/60']"
  >
    <span *ngIf="prefixIcon" class="pl-3 pr-1 text-base text-blue-100/80">
      {{ prefixIcon }}
    </span>

    <input
      #inputEl
      [type]="type"
      [value]="value"
      class="flex-1 px-4 py-2.5 bg-transparent border-none outline-none text-sm placeholder-blue-200/60"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="handleInput(inputEl.value)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)"
    />

    <span *ngIf="suffixIcon" class="pr-3 pl-1 text-base text-blue-100/80">
      {{ suffixIcon }}
    </span>
  </div>

  <p *ngIf="hint && !errorMessage" class="text-xs text-blue-100/70">
    {{ hint }}
  </p>

  <p *ngIf="errorMessage" class="text-xs text-red-400">
    {{ errorMessage }}
  </p>
</div>
