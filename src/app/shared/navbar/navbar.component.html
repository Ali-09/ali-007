<header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-xl bg-gradient-to-r from-black/80 via-black/70 to-black/80 shadow-lg">
  <div class="container mx-auto px-6 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <div
          class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-500 to-green-700 flex items-center justify-center shadow-lg hover:shadow-green-500/25 hover:scale-105 transition-all duration-300"
        >
          <span class="text-white font-bold">G</span>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">GTO Pago</h1>
          <p class="text-xs text-green-300">Sistema de Finanzas</p>
        </div>
      </div>

      <!-- Navegación -->
      <nav class="hidden md:flex items-center space-x-1">
        <app-nav-item
          label="Inicio"
          icon="🏠"
          itemKey="inicio"
          [active]="true"
          (hovered)="hoveredItem = $event"
        ></app-nav-item>
        <app-nav-item label="Perfil" icon="👤" itemKey="perfil" (hovered)="hoveredItem = $event"></app-nav-item>
        <app-nav-item
          label="Configuración"
          icon="⚙️"
          itemKey="configuracion"
          (hovered)="hoveredItem = $event"
        ></app-nav-item>
        <app-nav-item (click)="onLogout()" label="Salir" icon="🚪" itemKey="salir" (hovered)="hoveredItem = $event"></app-nav-item>
      </nav>
    </div>
  </div>

  <!-- Línea animada inferior -->
  <div
    class="absolute bottom-0 left-0 right-0 h-0.5 bg-gradient-to-r transition-all duration-500 ease-out shadow-lg"
    [ngClass]="getBorderColor()"
  ></div>
</header>
