<header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-xl bg-emerald-800/60 border-b border-emerald-700/40 shadow-lg">
  <div class="container mx-auto px-6 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <div
          class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-400 to-green-600 flex items-center justify-center shadow-lg hover:shadow-green-400/25 hover:scale-105 transition-transform transition-shadow duration-150"
        >
          <span class="text-white font-bold">G</span>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">GTO Pago</h1>
          <p class="text-xs text-slate-300">Sistema de Pagos</p>
        </div>
      </div>

      <!-- Navegación -->
      <nav class="hidden md:flex items-center space-x-1">
        <app-nav-item
          label="Inicio"
          icon="🏠"
          itemKey="inicio"
          [active]="isActive('inicio')"
          (hovered)="hoveredItem = $event"
          (click)="navigate('')"
        ></app-nav-item>
        <app-nav-item label="Finanzas" icon="💸" itemKey="perfil" [active]="isActive('perfil')" (hovered)="hoveredItem = $event" (click)="navigate('profile')"></app-nav-item>
        <app-nav-item
          label="Configuración"
          icon="⚙️"
          itemKey="configuracion"
          [active]="isActive('configuracion')"
          (hovered)="hoveredItem = $event"
        ></app-nav-item>
        <app-nav-item (click)="onLogout()" label="Salir" icon="🚪" itemKey="salir" (hovered)="hoveredItem = $event"></app-nav-item>
      </nav>
    </div>
  </div>

  <!-- Línea animada inferior -->
  <div
    class="absolute bottom-0 left-0 right-0 h-0.5 bg-gradient-to-r transition-colors transition-shadow duration-200 ease-out shadow-lg"
    [ngClass]="getBorderColor()"
  ></div>
</header>
