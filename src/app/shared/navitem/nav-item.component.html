<button
  class="group relative flex items-center space-x-2 px-4 py-2 rounded-lg transition-all duration-300 overflow-hidden"
  [ngClass]="active
    ? 'bg-black/30 text-white shadow-lg backdrop-blur-sm'
    : 'text-green-200 hover:bg-black/20 hover:text-white hover:backdrop-blur-sm'"
  (mouseenter)="hovered.emit(itemKey)"
  (mouseleave)="hovered.emit(null)"
>
  <div
    class="absolute inset-0 bg-gradient-to-r from-transparent via-green-900/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"
  ></div>

  <div class="relative z-10 flex items-center space-x-2">
    <div [ngClass]="getTextColor()" class="transition-all duration-300">{{ icon }}</div>
    <span [ngClass]="getTextColor()" class="text-sm font-medium transition-all duration-300">{{ label }}</span>
  </div>
</button>
