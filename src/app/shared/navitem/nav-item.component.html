<button
  class="group relative flex items-center space-x-2 px-4 py-2 rounded-lg transition-transform transition-colors transition-shadow duration-150 overflow-hidden"
  [ngClass]="active
    ? 'bg-white/20 text-white shadow-lg backdrop-blur-sm'
    : 'text-blue-200 hover:bg-white/10 hover:text-white hover:backdrop-blur-sm'"
  (mouseenter)="hovered.emit(itemKey)"
  (mouseleave)="hovered.emit(null)"
>
  <div
    class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-150"
  ></div>

  <div class="relative z-10 flex items-center space-x-2">
    <div [ngClass]="getTextColor()" class="transition-colors duration-150">{{ icon }}</div>
    <span [ngClass]="getTextColor()" class="text-sm font-medium transition-colors duration-150">{{ label }}</span>
  </div>
</button>
