<div class="space-y-1.5">
  <label *ngIf="label" class="block text-xs font-semibold tracking-wide text-blue-100/80 uppercase">
    {{ label }}
  </label>

  <div
    class="relative rounded-xl border border-white/10 bg-black/60 text-white shadow-sm focus-within:ring-2 focus-within:ring-emerald-400/70 focus-within:border-emerald-400 transition duration-150 hover:border-emerald-300/60"
    [class.opacity-60]="disabled"
  >
    <button
      type="button"
      class="w-full flex items-center justify-between px-4 py-2.5 text-sm bg-transparent focus:outline-none"
      [class.cursor-not-allowed]="disabled"
      [class.cursor-pointer]="!disabled"
      (click)="toggleOpen()"
      (blur)="handleBlur()"
    >
      <span
        class="truncate"
        [ngClass]="{
          'text-blue-200/70 italic': value === null,
          'text-blue-50': value !== null
        }"
      >
        {{ displayLabel }}
      </span>

      <span class="ml-3 inline-flex items-center justify-center w-5 h-5 rounded-full bg-emerald-400/15 border border-emerald-300/60 shadow-sm">
        <svg
          class="w-3 h-3 text-emerald-200 transition-transform duration-150"
          [ngClass]="{ 'rotate-180': open }"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M5 8L10 13L15 8"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </button>

    <div
      *ngIf="open"
      class="absolute left-0 right-0 mt-1 z-40"
    >
      <div class="rounded-xl border border-emerald-500/40 bg-slate-950/95 backdrop-blur-xl shadow-xl overflow-hidden">
        <div
          *ngIf="placeholder"
          class="px-4 py-2.5 text-xs text-blue-200/70 italic bg-slate-900/80 border-b border-white/10"
        >
          {{ placeholder }}
        </div>

        <div class="max-h-64 overflow-y-auto">
          <button
            *ngFor="let option of options"
            type="button"
            class="w-full text-left px-4 py-2.5 text-sm transition-colors duration-150"
            [ngClass]="
              option.value === value
                ? 'bg-emerald-600/80 text-white'
                : 'bg-slate-900/80 text-blue-50 hover:bg-emerald-600/60 hover:text-white'
            "
            (click)="handleChange(option.value)"
          >
            {{ option.label }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <p *ngIf="hint" class="text-xs text-blue-100/70">
    {{ hint }}
  </p>
</div>
